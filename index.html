<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e8a6c0'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='15' font-weight='700' text-anchor='middle' fill='%231a1520'%3EC%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e8a6c0'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='15' font-weight='700' text-anchor='middle' fill='%231a1520'%3EC%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a1520" />
    <meta name="description" content="Frontend · Agent · DX —— 把工程判断，写成可安装的工具与 Skill。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Karot · Frontend · Agent</title>
    <script>
      /* 主题提前落地：避免刷新时闪白，与参考站点 Karot 的启动脚本一致。 */
      ;(function () {
        try {
          var el = document.documentElement
          el.classList.add('booting')
          var p = localStorage.getItem('Karot-color-mode')
          if (p !== 'light' && p !== 'dark') {
            p = 'dark'
            try {
              localStorage.setItem('Karot-color-mode', 'dark')
            } catch (e) {}
          }
          var isDark = p !== 'light'
          el.classList.remove(isDark ? 'light' : 'dark')
          el.classList.add(isDark ? 'dark' : 'light')
          el.style.colorScheme = isDark ? 'dark' : 'light'
          el.style.backgroundColor = isDark ? '#1a1520' : '#f7dce6'
          var m = document.querySelector('meta[name="color-scheme"]')
          if (m) m.setAttribute('content', isDark ? 'dark' : 'light')
        } catch (e) {
          try {
            document.documentElement.classList.add('booting', 'dark')
          } catch (e2) {}
        }
        /* 兜底：万一应用未挂载，4s 后也要解除遮罩，避免页面被永久盖住 */
        setTimeout(function () {
          var el = document.documentElement
          if (el.classList.contains('booting')) {
            el.classList.remove('booting')
            el.classList.add('booted')
          }
        }, 4000)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
